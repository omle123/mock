<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            margin: 10;
        }
        .slidebar{
            height: 100vh;
            background-color: #343a40;
            color: white;
            padding: 15px;
        }
        .slidebar a {
            color: white;
            display: block;
            padding: 10px;
            text-decoration: none;
        }
        .slidebar a:hover {
            background-color: #495057;
        }
        .card {
            margin: 10px;
        }

    </style>
</head>
<body>
    
    
    <div class="container-fluid">
        <div class="row">
            <!--slideebar-->
            <div class="col-md-2 slidebar">
                <h3>
                    Dashboard
                </h3>
                <a href="#">Home</a>
                <a href="#">Users</a>
                <a href="#">Orders</a>
                <a href="#">Reports</a>
            </div>        

            <!-- Main Content-->
             <div class="col-md-10">
                <h2 class="mt-3">Admin Dashboard</h2>
                <div class="row">
                    <!--Card 1-->
                    <div class="col-md-3">
                            <div class="card text-bg-primary">
                                <div class="card-body">
                                    <h5>
                                        Total Userss
                                    </h5>
                                    <h3>130</h3>
                                </div>
                            </div>
                        </div>
                        <!--card 2-->
                    <div class="col-md-3">
                        <div class="card text-bg-success">
                            <div class="card-body">
                                <h5>
                                    Orders
                                </h5>
                                <h3>320</h3>
                            </div>
                        </div>
                    </div>
                    <!--Card 3-->
                     <div class="col-md-3">
                        <div class="card text-bg-danger">
                            <div class="card-body">
                                <h5>
                                    Revenue
                                </h5>
                                <h3>₹5000</h3>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-3">
                        <div class="card text-bg-warning">
                            <div class="card-body">
                                <h5>
                                    Exam
                                </h5>
                                <h3>12</h3>
                            </div>
                        </div>
                    </div>

                </div>
             </div>
        </div>
    </div>
    
</body>
</html>
